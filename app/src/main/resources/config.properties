# Configuration for local development.
# To run elsewhere, pass another file defining every key: java -jar app-all.jar /path/to/config.properties
# (see docker/config.properties). It replaces this one entirely.

# HTTP server
server.port=8080

# Database configuration
database.url=jdbc:postgresql://localhost:5432/webapptemplate
database.username=webapptemplate
database.password=webapptemplate
database.schema=public
database.poolName=webapp-pool
database.connectionTimeout=5
database.maximumPoolSize=10
database.applicationName=webapp-template
