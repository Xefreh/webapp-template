# Configuration of the app service in compose.yaml, mounted into the container and passed
# as argument to the jar. Same keys as app/src/main/resources/config.properties.

# HTTP server
server.port=8080

# Database configuration
database.url=jdbc:postgresql://postgres:5432/webapptemplate
database.username=webapptemplate
database.password=webapptemplate
database.schema=public
database.poolName=webapp-pool
database.connectionTimeout=5
database.maximumPoolSize=10
database.applicationName=webapp-template
